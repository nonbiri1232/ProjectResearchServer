behaviors:
  CardGame:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.01
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 10000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    max_steps: 3000000
    time_horizon: 256
    summary_freq: 10000
    checkpoint_interval: 500000
    keep_checkpoints: 6

environment_parameters:
  terminal_win_reward: 1.0
  terminal_loss_reward: -1.0
  memory_progress_reward_scale: 0.5
  valid_action_reward: -0.001
  failed_action_reward: -0.05
  invalid_selection_reward: -0.02
